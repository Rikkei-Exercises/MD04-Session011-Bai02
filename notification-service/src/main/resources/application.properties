server.port=8084
spring.application.name=notification-service

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:notification_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Consumer Configuration (GROUP-ID KHÁC VỚI INVENTORY-SERVICE)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.notificationservice.event.OrderEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Topic Configuration
kafka.topic.medicine-stock-events=medicine-stock-events

# Email Configuration (Mặc định Fallback Simulated nếu không cấu hình SMTP)
spring.mail.username=no-reply@pharmacy.com
